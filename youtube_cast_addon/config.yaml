name: "YouTube Music Player"
description: "Trình phát nhạc YouTube cao cấp"
version: "1.20.23"
slug: "youtube_cast_addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
panel_icon: "mdi:music-box-multiple"
panel_title: "YT Music"
ingress: true
ingress_port: 2232
hassio_role: manager
hassio_api: true
homeassistant_api: true

# Pre-built multi-arch images published to ghcr.io by .github/workflows/publish.yml
# Each version bump triggers a rebuild + push. HA pulls instead of building
# locally — critical on weak hosts (Pi 3 / 1GB) where pip install would OOM.
image: "ghcr.io/ducpm8/youtube_cast_addon-{arch}"
